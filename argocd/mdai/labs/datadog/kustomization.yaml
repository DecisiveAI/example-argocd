apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../catalog/globals/base/collector
- resources/datadog-params-configmap.yaml
replacements:
- source:
    kind: ConfigMap
    name: datadog-params
    fieldPath: data.HUB_NAME
  targets:
  - select:
      kind: OpenTelemetryCollector
      name: gateway
    fieldPaths:
    - metadata.labels.[mydecisive.ai/hub-name]
    options:
      create: true

- source:
    kind: ConfigMap
    name: datadog-params
    fieldPath: data.HUB_VARS_CM
  targets:
  - select:
      kind: OpenTelemetryCollector
      name: gateway
    fieldPaths:
    - spec.envFrom.0.configMapRef.name
    options:
      create: true

- source:
    kind: ConfigMap
    name: datadog-params
    fieldPath: data.GATEWAY_NAME
  targets:
  - select:
      kind: OpenTelemetryCollector
      name: gateway
    fieldPaths:
    - metadata.name

patches:
- path: patches/collector-envfrom.yaml
- path: patches/collector.yaml
