apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  labels:
    mydecisive.ai/hub-name: mdaihub-template
  name: trace-balancer
  namespace: mdai
spec:
  serviceAccount: loadbalancer
  image: otel/opentelemetry-collector-contrib:latest
  replicas: 1
  resources:
    limits:
      memory: "256Mi"
      cpu: "200m"
    requests:
      memory: "128Mi"
      cpu: "100m"
  config:
    receivers:
      otlp/from_agent:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    processors:
      memory_limiter:
        # Keep this safely below the pod limit (256Mi). Tune as needed.
        limit_mib: 200
        spike_limit_mib: 50
        check_interval: 1s

      batch:
        send_batch_size: 200
        send_batch_max_size: 1000
        timeout: 5s

      deltatocumulative: {}

    exporters:
      loadbalancing:
        routing_key: traceID
        protocol:
          otlp:
            compression: gzip
            tls:
              insecure: true
        resolver:
          k8s:
            service: gateway-collector-headless.mdai

      prometheus:
        endpoint: "0.0.0.0:8899"
        metric_expiration: 180m
        resource_to_telemetry_conversion:
          enabled: true

    connectors:
      count/service:
        spans:
          trace.span.service.total:
            description: Total span count by service (all spans).
          trace.span.service.root:
            description: Root span count by service.
            conditions:
              - 'IsRootSpan()'

    service:
      telemetry:
        resource:
          mdai-logstream: collector
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp/from_agent]
          processors: [memory_limiter, batch]
          exporters: [loadbalancing, count/service]
        metrics:
          receivers: [count/service]
          processors: [deltatocumulative]
          exporters: [prometheus]
