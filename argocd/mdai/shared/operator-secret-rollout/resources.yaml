apiVersion: v1
kind: ServiceAccount
metadata:
  name: mdai-operator-secret-rollout
  namespace: mdai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mdai-operator-secret-rollout
  namespace: mdai
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mdai-operator-secret-rollout
  namespace: mdai
subjects:
- kind: ServiceAccount
  name: mdai-operator-secret-rollout
  namespace: mdai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mdai-operator-secret-rollout
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mdai-operator-secret-rollout
  namespace: mdai
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: mdai-operator-secret-rollout
          restartPolicy: Never
          containers:
          - name: watcher
            image: bitnami/kubectl:latest
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -ec
            - |
              NS="mdai"
              SECRET_NAME="valkey-secret"
              DEPLOYMENTS_TO_RESTART="mdai-operator-controller-manager mdai-gateway mdai-event-hub"
              STATE_CM="mdai-operator-secret-rollout-state"
              TRACKED_CONFIGMAPS="mdaihub-variables mdaihub-manual-variables"

              secret_rv="$(kubectl -n "${NS}" get secret "${SECRET_NAME}" -o jsonpath='{.metadata.resourceVersion}')"
              cm_rvs=""
              for cm in ${TRACKED_CONFIGMAPS}; do
                cm_rv="$(kubectl -n "${NS}" get configmap "${cm}" -o jsonpath='{.metadata.resourceVersion}' 2>/dev/null || echo missing)"
                cm_rvs="${cm_rvs}${cm}:${cm_rv};"
              done

              current_fingerprint="secret:${SECRET_NAME}:${secret_rv};${cm_rvs}"
              previous_fingerprint="$(kubectl -n "${NS}" get configmap "${STATE_CM}" -o jsonpath='{.data.fingerprint}' 2>/dev/null || true)"

              if [ "${current_fingerprint}" = "${previous_fingerprint}" ]; then
                echo "No tracked change detected."
                exit 0
              fi

              echo "Change detected; restarting deployments: ${DEPLOYMENTS_TO_RESTART}"
              for d in ${DEPLOYMENTS_TO_RESTART}; do
                kubectl -n "${NS}" rollout restart deployment "${d}"
              done
              kubectl -n "${NS}" create configmap "${STATE_CM}" \
                --from-literal=fingerprint="${current_fingerprint}" \
                --dry-run=client -o yaml | kubectl apply -f -
