apiVersion: v1
kind: ServiceAccount
metadata:
  name: mdai-operator-secret-rollout
  namespace: mdai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mdai-operator-secret-rollout
  namespace: mdai
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mdai-operator-secret-rollout
  namespace: mdai
subjects:
- kind: ServiceAccount
  name: mdai-operator-secret-rollout
  namespace: mdai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mdai-operator-secret-rollout
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mdai-operator-secret-rollout
  namespace: mdai
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: mdai-operator-secret-rollout
          restartPolicy: Never
          containers:
          - name: watcher
            image: bitnami/kubectl:latest
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -ec
            - |
              NS="mdai"
              SECRET_NAME="valkey-secret"
              DEPLOYMENT_NAME="mdai-operator-controller-manager"
              STATE_CM="mdai-operator-secret-rollout-state"

              current_rv="$(kubectl -n "${NS}" get secret "${SECRET_NAME}" -o jsonpath='{.metadata.resourceVersion}')"
              previous_rv="$(kubectl -n "${NS}" get configmap "${STATE_CM}" -o jsonpath='{.data.resourceVersion}' 2>/dev/null || true)"

              if [ "${current_rv}" = "${previous_rv}" ]; then
                echo "No secret change detected."
                exit 0
              fi

              echo "Secret change detected (${previous_rv} -> ${current_rv}); restarting ${DEPLOYMENT_NAME}."
              kubectl -n "${NS}" rollout restart deployment "${DEPLOYMENT_NAME}"
              kubectl -n "${NS}" create configmap "${STATE_CM}" \
                --from-literal=resourceVersion="${current_rv}" \
                --dry-run=client -o yaml | kubectl apply -f -
