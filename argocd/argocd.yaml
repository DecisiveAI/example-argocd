apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mdai-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/MyDecisive/example-argocd.git
    targetRevision: sp/octant-ui
    path: argocd/apps
  destination:
    name: "in-cluster"
    namespace: argocd
  syncPolicy:
    automated:
      enabled: false
      prune: true
