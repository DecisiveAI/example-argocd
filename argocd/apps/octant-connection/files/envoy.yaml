static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address: { address: 0.0.0.0, port_value: {{ .Values.ingressPort }} }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: telemetry_service
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route:
                  cluster: primary_collector
                  request_mirror_policies:
                  - cluster: shadow_collector
                    # runtime_fraction:
                    #   default_value:
                    #     numerator: {{ .Values.shadowPercentage }}
                    #     denominator: HUNDRED
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              
  clusters:
    - name: primary_collector
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: primary_collector
        endpoints:
        - lb_endpoints:
          - endpoint:
              address:
                socket_address:
                  # Uses value if present, otherwise defaults to the release-named service
                  address: {{ default (printf "%s-primary-collector-service" .Release.Name) }}
                  port_value: {{ .Values.ingressPort }}
                  
    - name: shadow_collector
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: shadow_collector
        endpoints:
        - lb_endpoints:
          - endpoint:
              address:
                socket_address:
                  # Uses value if present, otherwise defaults to the release-named service
                  address: {{ default (printf "%s-shadow-collector-service" .Release.Name) }}
                  port_value: {{ .Values.ingressPort }}