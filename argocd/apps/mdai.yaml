apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mdai
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
  - repoURL: oci://ghcr.io/mydecisive/charts/mdai-hub
    chart: mdai
    targetRevision: 0.9.3-envoy
    helm:
      valueFiles:
      - $values/argocd/mdai/chart/local-values.yaml
  - repoURL: https://github.com/MyDecisive/example-argocd.git
    targetRevision: rlaw/mdai-labs-plus-envoy-hub-chart
    path: argocd/mdai/chart
    ref: values
  - repoURL: oci://ghcr.io/mydecisive/charts/octant-ui
    chart: octant-ui
    targetRevision: 0.1.1-dev
    helm:
      parameters:
        - name: deployment.gateway_host
          value: http://mdai-gateway.mdai.svc.cluster.local:8081
  destination:
    name: "in-cluster"
    namespace: mdai
  syncPolicy:
    automated:
      enabled: true
      prune: true
    syncOptions:
    - PruneLast=true
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 2
