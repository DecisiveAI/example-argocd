apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mdai-dynamic-filtration
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/MyDecisive/example-argocd.git
    targetRevision: rlaw/mdai-labs-plus-envoy-hub-chart
    path: argocd/mdai/labs/dynamic-filtration
  destination:
    name: in-cluster
    namespace: mdai
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - PruneLast=true
    - ServerSideApply=true
